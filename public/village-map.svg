<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1600" width="2400" height="1600">
  <defs>
    <!-- Sky / Snow Gradients -->
    <linearGradient id="snowGround" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F1F5" />
      <stop offset="50%" stop-color="#D9E7EE" />
      <stop offset="100%" stop-color="#C5D9E2" />
    </linearGradient>
    <linearGradient id="icePond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="roofRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C41E3A" />
      <stop offset="100%" stop-color="#8B1A1A" />
    </linearGradient>
    <linearGradient id="roofGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D6A4F" />
      <stop offset="100%" stop-color="#1B4332" />
    </linearGradient>
    <linearGradient id="wallWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4A373" />
      <stop offset="100%" stop-color="#BC6C25" />
    </linearGradient>
    <linearGradient id="townHallRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4A843" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>

    <!-- House Template -->
    <g id="house-red">
      <rect x="0" y="30" width="90" height="70" fill="url(#wallWood)" rx="6" stroke="#582F0E" stroke-width="3" />
      <!-- Windows & Glow -->
      <rect x="15" y="45" width="22" height="22" fill="#FEF08A" rx="3" stroke="#582F0E" stroke-width="2" />
      <line x1="26" y1="45" x2="26" y2="67" stroke="#582F0E" stroke-width="1.5" />
      <line x1="15" y1="56" x2="37" y2="56" stroke="#582F0E" stroke-width="1.5" />
      <rect x="53" y="45" width="22" height="22" fill="#FEF08A" rx="3" stroke="#582F0E" stroke-width="2" />
      <line x1="64" y1="45" x2="64" y2="67" stroke="#582F0E" stroke-width="1.5" />
      <line x1="53" y1="56" x2="75" y2="56" stroke="#582F0E" stroke-width="1.5" />
      <!-- Door -->
      <rect x="33" y="72" width="24" height="28" fill="#7F4F24" rx="3" />
      <circle cx="51" cy="87" r="2" fill="#FFD700" />
      <!-- Roof -->
      <polygon points="-8,35 45,-10 98,35" fill="url(#roofRed)" stroke="#582F0E" stroke-width="3" />
      <!-- Snow on roof -->
      <path d="M-8,35 Q10,25 25,28 Q45,-8 65,28 Q80,25 98,35 L95,42 Q80,33 65,36 Q45,0 25,36 Q10,33 -5,42 Z" fill="#FFFFFF" opacity="0.95" />
      <!-- Chimney with smoke -->
      <rect x="65" y="-5" width="14" height="22" fill="#8B1A1A" stroke="#582F0E" stroke-width="2" />
      <ellipse cx="72" cy="-5" rx="8" ry="4" fill="#FFFFFF" />
      <circle cx="75" cy="-18" r="6" fill="#FFFFFF" opacity="0.5" />
      <circle cx="80" cy="-30" r="9" fill="#FFFFFF" opacity="0.3" />
    </g>

    <g id="pine-tree">
      <polygon points="30,0 10,40 50,40" fill="#1B4332" />
      <polygon points="30,20 5,65 55,65" fill="#2D6A4F" />
      <polygon points="30,45 0,95 60,95" fill="#1B4332" />
      <rect x="25" y="95" width="10" height="20" fill="#582F0E" />
      <!-- Snow patches -->
      <path d="M22,25 Q30,15 38,25" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" />
      <path d="M15,50 Q30,40 45,50" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" />
      <path d="M10,80 Q30,70 50,80" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none" />
    </g>
  </defs>

  <!-- Snow Background Landscape -->
  <rect x="0" y="0" width="2400" height="1600" fill="url(#snowGround)" />

  <!-- Mountain Hills in Background -->
  <path d="M0,450 Q350,150 700,420 T1400,380 T2100,350 T2400,420 L2400,0 L0,0 Z" fill="#B0C4DE" opacity="0.4" />
  <path d="M0,320 Q400,80 900,300 T1800,240 T2400,280 L2400,0 L0,0 Z" fill="#FFFFFF" opacity="0.7" />

  <!-- Cobblestone / Snowy Paths Connecting the Village -->
  <path d="M200,300 Q500,450 800,400 T1400,600 T1800,550 T2200,650" fill="none" stroke="#D1B89D" stroke-width="45" stroke-linecap="round" opacity="0.6" />
  <path d="M800,400 Q1000,750 1200,800 T1600,1100 T1900,1350" fill="none" stroke="#D1B89D" stroke-width="40" stroke-linecap="round" opacity="0.6" />
  <path d="M400,900 Q700,850 1200,800 T1600,850 T2100,1050" fill="none" stroke="#D1B89D" stroke-width="40" stroke-linecap="round" opacity="0.6" />
  <path d="M300,1250 Q600,1100 1200,800 T2100,1400" fill="none" stroke="#D1B89D" stroke-width="40" stroke-linecap="round" opacity="0.6" />

  <!-- Frozen Ice Pond / Ice Skating Rink -->
  <ellipse cx="1750" cy="780" rx="220" ry="140" fill="url(#icePond)" stroke="#DBEAFE" stroke-width="12" />
  <ellipse cx="1750" cy="780" rx="190" ry="115" fill="#BFDBFE" opacity="0.5" />
  <!-- Skater tracks -->
  <path d="M1650,750 Q1750,820 1850,740" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.7" />
  <path d="M1680,800 Q1720,730 1800,790" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.7" />

  <!-- Forest Clumps (Trees) -->
  <use href="#pine-tree" x="80" y="180" transform="scale(1.4)" />
  <use href="#pine-tree" x="140" y="210" transform="scale(1.2)" />
  <use href="#pine-tree" x="650" y="100" transform="scale(1.5)" />
  <use href="#pine-tree" x="720" y="140" transform="scale(1.2)" />
  <use href="#pine-tree" x="1450" y="120" transform="scale(1.6)" />
  <use href="#pine-tree" x="1550" y="160" transform="scale(1.3)" />
  <use href="#pine-tree" x="2200" y="200" transform="scale(1.5)" />
  <use href="#pine-tree" x="2260" y="240" transform="scale(1.2)" />

  <use href="#pine-tree" x="100" y="650" transform="scale(1.5)" />
  <use href="#pine-tree" x="50" y="980" transform="scale(1.4)" />
  <use href="#pine-tree" x="600" y="980" transform="scale(1.3)" />
  <use href="#pine-tree" x="900" y="1150" transform="scale(1.4)" />
  <use href="#pine-tree" x="1400" y="1280" transform="scale(1.5)" />
  <use href="#pine-tree" x="1850" y="1200" transform="scale(1.4)" />

  <!-- Village Center Square (for Day 24 Grand Hall) -->
  <circle cx="1008" cy="672" r="140" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="8" />
  <circle cx="1008" cy="672" r="120" fill="none" stroke="#D4A843" stroke-width="3" stroke-dasharray="8 8" />

  <!-- Giant Village Center Christmas Tree -->
  <g transform="translate(1008, 640) scale(1.8) translate(-30, -80)">
    <polygon points="30,-10 5,45 55,45" fill="#1B4332" />
    <polygon points="30,20 -5,80 65,80" fill="#2D6A4F" />
    <polygon points="30,55 -15,120 75,120" fill="#1B4332" />
    <rect x="22" y="120" width="16" height="25" fill="#582F0E" />
    <!-- Glowing Star on Top -->
    <polygon points="30,-22 34,-12 45,-12 36,-5 39,6 30,0 21,6 24,-5 15,-12 26,-12" fill="#FFD700" stroke="#FFA500" stroke-width="1.5" />
    <!-- Baubles -->
    <circle cx="20" cy="30" r="4" fill="#C41E3A" />
    <circle cx="40" cy="35" r="4" fill="#FFD700" />
    <circle cx="15" cy="70" r="5" fill="#3B82F6" />
    <circle cx="35" cy="65" r="5" fill="#C41E3A" />
    <circle cx="50" cy="75" r="4" fill="#EAB308" />
    <circle cx="10" cy="105" r="5" fill="#EF4444" />
    <circle cx="30" cy="98" r="5" fill="#FFD700" />
    <circle cx="52" cy="110" r="5" fill="#10B981" />
  </g>

  <!-- Village Houses (Representing the 24 Door Locations) -->
  <!-- 1 --> <use href="#house-red" x="240" y="240" transform="scale(1.2)" />
  <!-- 2 --> <use href="#house-red" x="840" y="400" transform="scale(1.2)" />
  <!-- 3 --> <use href="#house-red" x="1320" y="160" transform="scale(1.2)" />
  <!-- 4 --> <use href="#house-red" x="1800" y="480" transform="scale(1.2)" />
  <!-- 5 --> <use href="#house-red" x="480" y="720" transform="scale(1.2)" />
  <!-- 6 --> <use href="#house-red" x="1152" y="640" transform="scale(1.2)" />
  <!-- 7 --> <use href="#house-red" x="2040" y="560" transform="scale(1.2)" />
  <!-- 8 --> <use href="#house-red" x="192" y="880" transform="scale(1.2)" />
  <!-- 9 --> <use href="#house-red" x="720" y="800" transform="scale(1.2)" />
  <!-- 10 --> <use href="#house-red" x="1488" y="768" transform="scale(1.2)" />
  <!-- 11 --> <use href="#house-red" x="1080" y="960" transform="scale(1.2)" />
  <!-- 12 --> <use href="#house-red" x="1872" y="928" transform="scale(1.2)" />
  <!-- 13 --> <use href="#house-red" x="360" y="1040" transform="scale(1.2)" />
  <!-- 14 --> <use href="#house-red" x="1320" y="1120" transform="scale(1.2)" />
  <!-- 15 --> <use href="#house-red" x="2112" y="1088" transform="scale(1.2)" />
  <!-- 16 --> <use href="#house-red" x="600" y="1200" transform="scale(1.2)" />
  <!-- 17 --> <use href="#house-red" x="1008" y="1152" transform="scale(1.2)" />
  <!-- 18 --> <use href="#house-red" x="1632" y="1248" transform="scale(1.2)" />
  <!-- 19 --> <use href="#house-red" x="240" y="1312" transform="scale(1.2)" />
  <!-- 20 --> <use href="#house-red" x="1200" y="1280" transform="scale(1.2)" />
  <!-- 21 --> <use href="#house-red" x="1920" y="1360" transform="scale(1.2)" />
  <!-- 22 --> <use href="#house-red" x="720" y="1408" transform="scale(1.2)" />
  <!-- 23 --> <use href="#house-red" x="1440" y="1440" transform="scale(1.2)" />

  <!-- Gentle Snowfall Dots across the scene -->
  <g fill="#FFFFFF" opacity="0.6">
    <circle cx="300" cy="150" r="5" />
    <circle cx="850" cy="220" r="4" />
    <circle cx="1200" cy="180" r="6" />
    <circle cx="1700" cy="240" r="4" />
    <circle cx="2150" cy="180" r="5" />
    <circle cx="450" cy="500" r="5" />
    <circle cx="950" cy="550" r="4" />
    <circle cx="1400" cy="480" r="6" />
    <circle cx="1950" cy="450" r="5" />
    <circle cx="250" cy="800" r="6" />
    <circle cx="780" cy="850" r="5" />
    <circle cx="1300" cy="900" r="4" />
    <circle cx="1650" cy="870" r="5" />
    <circle cx="2250" cy="850" r="6" />
    <circle cx="500" cy="1200" r="4" />
    <circle cx="1050" cy="1250" r="6" />
    <circle cx="1550" cy="1220" r="5" />
    <circle cx="2050" cy="1200" r="4" />
  </g>
</svg>

